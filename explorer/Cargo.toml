[package]
name = "zeroday-fm"
version = "1.0.0"
edition = "2021"
description = "File explorer for ZERO-DAY OS on M5Stack Cardputer Zero (320x170, 46-key, no mouse)"
authors = ["ZERO-DAY OS"]

[dependencies]
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.28"
unicode-width = "0.2"
walkdir = "2"
chrono = "0.4"
regex = "1"
nix = { version = "0.29", features = ["fs"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
