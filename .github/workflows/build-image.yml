name: Build & Release ZERO-DAY OS Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload assets to (e.g. v4.5.0)'
        required: true
        default: 'v4.5.0'

jobs:
  build:
    name: Build arm64 Image
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6h — pi-gen arm64 under QEMU takes 3-4h

    permissions:
      contents: write

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi
          echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify arm64 emulation works
        run: docker run --rm --platform linux/arm64 arm64v8/alpine uname -m

      - name: Install qemu-user-static on runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user-static
          which qemu-aarch64-static
          ls -la /usr/bin/qemu-aarch64-static

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Cache apt packages (speeds up reruns)
        uses: actions/cache@v4
        with:
          path: pi-gen/work/apt-cache
          key: apt-cache-bookworm-arm64-${{ hashFiles('pi-gen/stage4/**/*-run.sh') }}
          restore-keys: |
            apt-cache-bookworm-arm64-

      - name: Build ZERO-DAY OS image
        id: build
        run: |
          cd pi-gen

          # Skip stage5 (desktop) — not needed for pentest OS
          touch stage5/SKIP stage5/SKIP_IMAGES 2>/dev/null || true

          # If apt cache dir exists from previous run, inject it
          if [ -d work/apt-cache ]; then
            echo "APT_PROXY=DIRECT" >> config
            echo "Found cached apt packages: $(du -sh work/apt-cache)"
          fi

          # Fresh build (no leftover containers)
          CONTINUE=0 PRESERVE_CONTAINER=0 ./build-docker.sh

          ls -lh deploy/
          FULL=$(ls deploy/*.zip 2>/dev/null | grep -v lite | head -1)
          LITE=$(ls deploy/*lite*.zip 2>/dev/null | head -1)
          [ -z "$LITE" ] && LITE=$(ls deploy/*.zip 2>/dev/null | tail -1)
          echo "FULL_ZIP=$FULL" >> $GITHUB_OUTPUT
          echo "LITE_ZIP=$LITE"  >> $GITHUB_OUTPUT

      - name: List deploy artifacts
        run: ls -lh pi-gen/deploy/

      - name: Upload full image to release
        if: steps.build.outputs.FULL_ZIP != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          files: ${{ steps.build.outputs.FULL_ZIP }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload lite image to release
        if: steps.build.outputs.LITE_ZIP != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          files: ${{ steps.build.outputs.LITE_ZIP }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload images as workflow artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: zeroday-os-${{ steps.tag.outputs.DATE }}
          path: pi-gen/deploy/*.zip
          retention-days: 7
          if-no-files-found: warn
