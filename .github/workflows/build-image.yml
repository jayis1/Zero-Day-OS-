name: Build & Release ZERO-DAY OS Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload assets to (e.g. v4.5.0)'
        required: true
        default: 'v4.5.0'

jobs:
  build:
    name: Build arm64 Image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write   # needed to upload release assets

    steps:

      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi
          echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Install host QEMU static binary
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-user-static
          command -v qemu-aarch64-static

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Verify arm64 emulation works
        run: docker run --rm --platform linux/arm64 arm64v8/alpine uname -m

      - name: Free disk space
        run: |
          # GitHub runners have ~14GB free by default — images need ~12GB
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Build ZERO-DAY OS — Full image
        id: build_full
        run: |
          cd pi-gen
          # Ensure config is present (already committed to repo)
          ls -la config
          # Skip stage5 (desktop) — we don't need it
          touch stage5/SKIP
          # Run the Docker build (CONTINUE=0 = fresh build)
          CONTINUE=0 ./build-docker.sh
          # Find the output images
          ls -lh deploy/
          FULL=$(ls deploy/*full*.zip 2>/dev/null | head -1)
          echo "FULL_ZIP=$FULL" >> $GITHUB_OUTPUT

      - name: Build ZERO-DAY OS — Lite image
        id: build_lite
        run: |
          # Lite image was already produced by the same build run
          cd pi-gen
          LITE=$(ls deploy/*lite*.zip 2>/dev/null | head -1)
          echo "LITE_ZIP=$LITE" >> $GITHUB_OUTPUT

      - name: List deploy artifacts
        run: ls -lh pi-gen/deploy/

      - name: Upload full image to release
        if: steps.build_full.outputs.FULL_ZIP != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          files: ${{ steps.build_full.outputs.FULL_ZIP }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload lite image to release
        if: steps.build_lite.outputs.LITE_ZIP != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          files: ${{ steps.build_lite.outputs.LITE_ZIP }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload full image as workflow artifact (backup)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zeroday-os-full-${{ steps.tag.outputs.DATE }}
          path: pi-gen/deploy/*full*.zip
          retention-days: 7
          if-no-files-found: warn

      - name: Upload lite image as workflow artifact (backup)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zeroday-os-lite-${{ steps.tag.outputs.DATE }}
          path: pi-gen/deploy/*lite*.zip
          retention-days: 7
          if-no-files-found: warn
